  <section><h3>${I('award',18)}Certificates & achievements</h3><ul class="tl">${D.certs.map(o=>`<li><em>${o[0]}</em><b>${o[1]}</b><span>${o[2]}</span></li>`).join('')}</ul></section>
 </div></section>`,
`<section class="scene s2" aria-label="Experience"><div class="hero">
 <p class="rv lbl" style="--i:0">Menu 03</p><h2 class="rv" style="--i:1">My Professional Journey</h2>
 <p class="rv" style="--i:2;color:#efe6cf;text-shadow:0 2px 12px #000">Select a position to read the details.</p>
 <ul class="jobs rv" style="--i:3" id="jobs">${D.jobs.map((j,k)=>`<li><button class="tj" data-j="${k}"><em>${j.p}</em><b>${j.s}</b></button></li>`).join('')}<li><button class="tj" data-j="${D.jobs.length}"><em>Independent</em><b>Freelance & personal projects</b></button></li></ul></div>
 <div class="panel rv" style="--i:3;justify-self:end;width:100%;max-width:820px" id="jd" tabindex="0" aria-live="polite"></div></section>`];
function job(k){const el=$('#jd');$$('.tj').forEach(b=>{const on=+b.dataset.j===k;b.classList.toggle('on',on);b.setAttribute('aria-current',on)});
 if(k>=D.jobs.length){el.innerHTML=`<div class="fade"><p class="lbl">${I('spark',16)} Independent</p><h2 style="font-size:2rem">Freelance & personal projects</h2>${D.ind.map(p=>`<div class="pj"><h4>${p[0]}</h4><p>${p[1]}</p><span class="soon">Link coming soon</span></div>`).join('')}</div>`}
 else{const j=D.jobs[k];el.innerHTML=`<div class="fade"><p class="lbl">${j.p}</p><h2 style="font-size:2rem">${j.c}</h2><p class="gold" style="font-weight:600;font-size:1.1rem">${j.r}</p>
 <div class="meta">${j.m.map(m=>`<span>${m[0]}: <b>${m[1]}</b></span>`).join('')}</div><div class="gr">${j.g.map(g=>`<div><h4>${g[0]}</h4>${ul(g[1])}</div>`).join('')}</div></div>`}el.scrollTop=0}
/* ===== ENGINE ===== */
const names=['Profile','Background','Experience'],ic=['user','cap','case'],keys=['profile','background','experience'];let cur=-1;
$('#main').innerHTML=S.join('');
$('#nav').innerHTML=names.map((n,i)=>`<button data-i="${i}">${I(ic[i],18)}<span>${n}</span></button>`).join('');
$('#mail').innerHTML=`<a href="mailto:${D.email}" aria-label="Send email">${I('mail',18)}</a>`;
$('#prev').innerHTML=I('back');$('#next').innerHTML=I('arrow');
$('#bgs').innerHTML=CFG.imgs.map(()=>'<div class="bg"></div>').join('');
document.documentElement.style.setProperty('--dim',CFG.dim);
/* images: local file first (images/menu1.jpg ...), then Google Drive */
CFG.imgs.forEach((m,i)=>{const c=['jpg','jpeg','png','webp'].map(e=>`images/${m.f}.${e}`).concat(`https://lh3.googleusercontent.com/d/${m.id}=w2400`),el=$$('.bg')[i];
 (function t(n){if(n>=c.length)return;const im=new Image();im.onload=()=>el.style.backgroundImage=`url("${c[n]}")`;im.onerror=()=>t(n+1);im.src=c[n]})(0)});
function go(i){i=(i+3)%3;if(i===cur)return;cur=i;
 $$('.scene').forEach((s,k)=>{s.classList.toggle('on',k===i);if(k===i){s.scrollTop=0;$$('.panel',s).forEach(p=>p.scrollTop=0)}});
 $$('.bg').forEach((b,k)=>b.classList.toggle('on',k===i));
 $$('#nav button').forEach((b,k)=>{b.classList.toggle('on',k===i);b.setAttribute('aria-current',k===i)});
 $('#count').innerHTML=`<b>0${i+1}</b> / 03 &nbsp; ${names[i]}`;history.replaceState(null,'','#'+keys[i]);document.title=names[i]+' — '+D.name}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)};
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
$('#jobs').onclick=e=>{const b=e.target.closest('.tj');if(b)job(+b.dataset.j)};
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
let tx=0,ty=0;addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*2&&!e.target.closest('#jobs'))go(cur+(dx<0?1:-1))},{passive:true});
if(matchMedia('(hover:hover)').matches&&!matchMedia('(prefers-reduced-motion:reduce)').matches)addEventListener('mousemove',e=>{const b=$('#bgs').style;b.setProperty('--px',(e.clientX/innerWidth-.5)*-18+'px');b.setProperty('--py',(e.clientY/innerHeight-.5)*-12+'px')});
job(0);go(Math.max(0,keys.indexOf(location.hash.slice(1))));
</script>
</body>
