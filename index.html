  <div class="dt" id="jd" aria-live="polite"></div></div></div></div></section>`];
function job(k){const el=$('#jd');$$('.tj').forEach(b=>{const on=+b.dataset.j===k;b.classList.toggle('on',on);b.setAttribute('aria-current',on)});
 el.innerHTML=k>=D.jobs.length?`<div class="fl"><p class="lbl">Independent</p><h2 data-fx>Freelance & personal projects</h2>${D.ind.map(p=>`<div class="pj"><h4>${p[0]}</h4><p>${p[1]}</p>${ok(p[2])?`<a class="lnk" href="${esc(p[2])}" target="_blank" rel="noopener noreferrer">Open project ${I('ext',14)}</a>`:'<span class="soon">Link coming soon</span>'}</div>`).join('')}</div>`
 :(j=>`<div class="fl"><p class="lbl">${j.p}</p><h2 data-fx>${j.c}</h2><p class="rl">${j.r}</p><div class="meta">${j.m.map(m=>`<span>${m[0]}: <b>${m[1]}</b></span>`).join('')}</div><div class="gr">${j.g.map(g=>`<div><h4>${g[0]}</h4>${ul(g[1])}</div>`).join('')}</div></div>`)(D.jobs[k]);
 $('.s2 .bd').scrollTop=0;fx(el)}
/* glitch / decode text effect */
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches,CH='ABCDEF0123456789<>/\\_+#%&';
function scr(el){if(RM)return;const t=el.dataset.t||(el.dataset.t=el.textContent);clearInterval(el._i);let f=0;el.classList.add('gl');
 el._i=setInterval(()=>{f++;const k=Math.floor(t.length*f/22);el.textContent=[...t].map((c,i)=>i<k||c===' '?c:CH[Math.random()*CH.length|0]).join('');if(f>=22){clearInterval(el._i);el.textContent=t;el.classList.remove('gl')}},42)}
function fx(r){$$('[data-fx]',r).forEach((e,i)=>setTimeout(()=>scr(e),250+i*120))}
const names=['Profile','Background','Experience'],ic=['user','cap','case'],keys=['profile','background','experience'];let cur=-1;
$('#main').innerHTML=S.join('');
$('#nav').innerHTML=names.map((n,i)=>`<button data-i="${i}">${I(ic[i],18)}<span>${n}</span></button>`).join('');
$('#mailb').innerHTML=I('mail',18);$('#prev').innerHTML=I('back');$('#next').innerHTML=I('arrow');$('#dx').innerHTML=I('x',18);
$('#bgs').innerHTML=CFG.imgs.map(()=>'<div class="bg"></div>').join('');
document.documentElement.style.setProperty('--dim',CFG.dim);
CFG.imgs.forEach((m,i)=>{const c=['jpg','jpeg','png','webp'].map(e=>`images/${m.f}.${e}`).concat(`https://lh3.googleusercontent.com/d/${m.id}=w2400`),el=$$('.bg')[i];
 (function t(n){if(n>=c.length)return;const im=new Image();im.onload=()=>el.style.backgroundImage=`url("${c[n]}")`;im.onerror=()=>t(n+1);im.src=c[n]})(0)});
function go(i){i=(i+3)%3;if(i===cur)return;cur=i;
 $$('.scene').forEach((s,k)=>{s.classList.toggle('on',k===i);if(k===i){s.scrollTop=0;$$('.bd',s).forEach(p=>p.scrollTop=0);fx(s)}});
 $$('.bg').forEach((b,k)=>b.classList.toggle('on',k===i));
 $$('#nav button').forEach((b,k)=>{b.classList.toggle('on',k===i);b.setAttribute('aria-current',k===i)});
 history.replaceState(null,'','#'+keys[i]);document.title=names[i]+' — '+D.name}
/* show / hide content to enjoy the background */
function clear(on){document.body.classList.toggle('clear',on);const b=$('#bgt');b.setAttribute('aria-pressed',on);b.innerHTML=on?I('eyeoff',18)+'Show content':I('eye',18)+'View background'}
$('#bgt').onclick=()=>clear(!document.body.classList.contains('clear'));clear(false);
/* contact pop-up */
function contact(){const c=D.contact,r=[];const row=(ic,l,v,h)=>h?`<li><a href="${esc(h)}" target="_blank" rel="noopener noreferrer">${I(ic)}<div><small>${l}</small><span>${esc(v)}</span></div></a></li>`:`<li><div>${I(ic)}<div><small>${l}</small><span>${esc(v)}</span></div></div></li>`;
 let d=(c.whatsapp||'').replace(/\D/g,'');if(d.startsWith('0'))d='62'+d.slice(1);
 if(d)r.push(row('wa','WhatsApp','+'+d,'https://wa.me/'+d));if(c.phone)r.push(row('phone','Phone',c.phone,'tel:'+c.phone.replace(/[^\d+]/g,'')));
 if(c.instagram){const u=c.instagram.trim().replace(/^https?:\/\/(www\.)?instagram\.com\//i,'').replace(/^@/,'').replace(/[\/?#].*$/,'');r.push(row('ig','Instagram','@'+u,'https://instagram.com/'+encodeURIComponent(u)))}
 if(c.email)r.push(row('mail','Email',c.email,'mailto:'+c.email));if(c.address)r.push(row('home','Address',c.address,'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(c.address)));
 $('#cl').innerHTML=r.join('')}
const dlg=$('#dlg');$('#mailb').onclick=()=>{contact();dlg.showModal?dlg.showModal():dlg.setAttribute('open','')};
$('#dx').onclick=()=>dlg.close();dlg.onclick=e=>{if(e.target===dlg)dlg.close()};
document.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(b){const t=b.dataset.copy;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{}).finally(()=>{const o=b.innerHTML;b.textContent='Copied';setTimeout(()=>b.innerHTML=o,1400)})}});
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)};
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
$('#jobs').onclick=e=>{const b=e.target.closest('.tj');if(b)job(+b.dataset.j)};
document.addEventListener('keydown',e=>{if(dlg.open)return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
let tx=0,ty=0;addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*2&&!e.target.closest('.jobs,dialog'))go(cur+(dx<0?1:-1))},{passive:true});
if(matchMedia('(hover:hover)').matches&&!RM)addEventListener('mousemove',e=>{const b=$('#bgs').style;b.setProperty('--px',(e.clientX/innerWidth-.5)*-18+'px');b.setProperty('--py',(e.clientY/innerHeight-.5)*-12+'px')});
job(0);go(Math.max(0,keys.indexOf(location.hash.slice(1))));
</script>
