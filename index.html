.panel>section:nth-child(2){--k:2}.panel>section:nth-child(3){--k:3}.panel>section:nth-child(4){--k:4}.panel>section:nth-child(5){--k:5}
@media (max-width:900px){

function csv(t){const r=[];let w=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){w.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;w.push(f);r.push(w);w=[];f=''}else f+=c}if(f!==''||w.length){w.push(f);r.push(w)}return r}
function rowsOf(t){const a=csv(t),h=(a.shift()||[]).map(x=>x.trim().toLowerCase());return a.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])))}
async function load(){const id=(typeof SHEET_ID==='string'?SHEET_ID:'').trim(),R={};if(!id)return FALLBACK;
 await Promise.all(TABS.map(async n=>{try{const c=new AbortController(),t=setTimeout(()=>c.abort(),7000),r=await fetch(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&headers=1&sheet=${n}`,{cache:'no-store',signal:c.signal});clearTimeout(t);const x=await r.text();if(!r.ok||/^\s*</.test(x))throw 0;R[n]=rowsOf(x)}catch(_){R[n]=FALLBACK[n]}}));return R}
function grp(a,k){const m=new Map();let last='';(a||[]).forEach(r=>{const g=r[k]||last;last=g;if(!m.has(g))m.set(g,[]);m.get(g).push(r)});return[...m]}
const kv=a=>Object.fromEntries((a||[]).map(r=>[r.kunci,r.isi]));
function build(R){const sk=R.Skill||[];return{p:kv(R.Profil),st:kv(R.Pengaturan),skills:sk.filter(r=>r.jenis==='skill'&&r.nama),soft:sk.filter(r=>r.jenis==='software'&&r.nama),stats:(R.Sorotan||[]).filter(r=>r.angka),
 bg:grp((R.LatarBelakang||[]).filter(r=>r.judul),'kelompok'),jobs:(R.Pengalaman||[]).filter(j=>j.perusahaan).map(j=>({...j,g:grp((R.Tugas||[]).filter(t=>t.id===j.id&&t.tugas),'kelompok')})),
 port:(R.Portofolio||[]).filter(r=>r.judul),con:(R.Kontak||[]).filter(r=>r.isi),arc:grp((R.Arsip||[]).filter(r=>r.judul),'kategori')}}
/* contact helpers */
const CT={whatsapp:['wa','WhatsApp'],telepon:['phone','Phone'],instagram:['ig','Instagram'],email:['mail','Email'],alamat:['home','Address'],linkedin:['globe','LinkedIn'],github:['globe','GitHub'],website:['globe','Website'],lainnya:['globe','Link']};
function clink(c){const j=(c.jenis||'').toLowerCase(),v=c.isi,m=CT[j]||CT.lainnya;let h='',t=v;
 if(j==='whatsapp'){let d=v.replace(/\D/g,'');if(d[0]=='0')d='62'+d.slice(1);h='https://wa.me/'+d;t='+'+d}
 else if(j==='telepon')h='tel:'+v.replace(/[^\d+]/g,'');
 else if(j==='instagram'){const u=v.replace(/^https?:\/\/(www\.)?instagram\.com\//i,'').replace(/^@/,'').replace(/[\/?#].*$/,'');h='https://instagram.com/'+encodeURIComponent(u);t='@'+u}
 else if(j==='email')h='mailto:'+v;
 else if(j==='alamat')h='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(v);
 else if(ok(v)){h=v;t=v.replace(/^https?:\/\/(www\.)?/i,'').replace(/\/$/,'')}
 return{ic:m[0],l:c.label||m[1],h,t}}
const crow=c=>{const x=clink(c),b=`${I(x.ic)}<div><small>${e(x.l)}</small><span>${e(x.t)}</span></div>`;return x.h?`<li><a href="${e(x.h)}" target="_blank" rel="noopener noreferrer">${b}</a></li>`:`<li><div>${b}</div></li>`};
/* ===== SCENES ===== */
const ORN='<svg width="150" height="22" viewBox="0 0 150 22" fill="none" stroke="#E7B94F" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><path d="M2 11h58M90 11h58"/><path d="M75 19V8M75 13c-5 0-8-3-8-7 5 0 8 3 8 7zM75 13c5 0 8-3 8-7-5 0-8 3-8 7z"/></svg>';
const per=j=>j.awal&&j.akhir&&j.awal!==j.akhir?`${j.awal} – ${j.akhir}`:(j.awal||j.akhir||'');
function scenes(M){const p=M.p,nm=(p.name||'').split(' '),n2=nm.pop(),n1=nm.join(' '),gi=['cap','book','users','award'];
 const facts=[['pin','Based in',p.location],['user','Born',[p.birth_place,p.birth_date].filter(Boolean).join(', ')],['globe','Languages',p.languages]].filter(f=>f[2]);
 const sec=(ic,t,b)=>`<section><h3>${I(ic,18)}${e(t)}</h3>${b}</section>`;
 const bgSec=([g,it],i)=>sec(gi[i%4],g||'Background',it.some(x=>x.tahun)?`<ul class="tl">${it.map(x=>`<li>${x.tahun?`<em>${e(x.tahun)}</em>`:''}<b>${e(x.judul)}${x.nilai?`<span class="hl">${e(x.nilai)}</span>`:''}</b>${x.detail?`<span>${e(x.detail)}</span>`:''}${x.link?`<div class="vf">${lnk(x.link,'Open')}</div>`:''}</li>`).join('')}</ul>`:ul(it.map(x=>e(x.judul)+(x.detail?` — ${e(x.detail)}`:'')+(x.nilai?`<span class="hl">${e(x.nilai)}</span>`:''))));
 const arc=([g,it])=>sec('folder',g||'Archive',it.map(x=>`<div class="ar"><div><h4>${e(x.judul)}</h4><p>${[x.tahun,x.deskripsi].filter(Boolean).map(e).join(' · ')}</p></div>${x.sorotan?`<span class="hl">${e(x.sorotan)}</span>`:''}<div class="vf">${x.link?lnk(x.link,'View document'):'<span class="soon">Link coming soon</span>'}${x.kode?`<button data-copy="${e(x.kode)}" aria-label="Copy verification code">Code: ${e(x.kode)} ${I('copy',14)}</button>`:''}</div></div>`).join(''));
 const pj=x=>`<div class="pj"><h4>${e(x.judul)}</h4>${x.tag?`<div class="tags">${x.tag.split(',').map(t=>`<span>${e(t.trim())}</span>`).join('')}</div>`:''}<p>${e(x.deskripsi)}</p>${ok(x.link)?lnk(x.link,'Open project'):'<span class="soon">Link coming soon</span>'}</div>`;
 return[
`<section class="scene s0" aria-label="Profile"><div class="hero"><p class="lbl" data-fx>Personal portfolio</p><h1><span data-fx>${e(n1)}</span><br><span data-fx>${e(n2)}</span></h1><p class="ttl" data-fx>${e(p.title)}</p><div class="orn">${ORN}</div>${p.tagline?`<p class="tag">${e(p.tagline)}</p>`:''}${p.motto?`<blockquote class="quote">“${e(p.motto)}”</blockquote>`:''}<button class="cta" onclick="go(1)">Explore my background ${I('arrow')}</button></div>
 <div class="pw"><div class="panel" tabindex="0" aria-label="About me">${p.about?sec('user','About me',`<p>${e(p.about)}</p>`):''}${facts.length?`<section><ul class="facts">${facts.map(f=>`<li>${I(f[0])}<div><small>${f[1]}</small>${e(f[2])}</div></li>`).join('')}</ul></section>`:''}${M.skills.length?sec('chart','Core skills',`<ul class="chips">${M.skills.map(s=>`<li>${e(s.nama)}</li>`).join('')}</ul>`):''}${M.soft.length?sec('leaf','Software',M.soft.map(s=>`<div class="bar" style="--w:${parseInt(s.nilai)||0}%"><div><span>${e(s.nama)}</span><b>${e(s.nilai)}%</b></div><i></i></div>`).join('')):''}</div></div></section>`,
`<section class="scene s1" aria-label="Background"><div class="hero"><h2 data-fx>My Background</h2><p class="ttl" data-fx>Education · Achievements · Credentials</p>${M.stats.length?`<div class="stats">${M.stats.map(s=>`<div><b>${e(s.angka)}</b><small>${e(s.label)}</small></div>`).join('')}</div>`:''}<button class="cta" onclick="go(2)">See my experience ${I('arrow')}</button></div>
 <div class="pw"><div class="panel" tabindex="0" aria-label="Education">${M.bg.map(bgSec).join('')||'<p class="empty">No data yet.</p>'}</div></div></section>`,
`<section class="scene s2" aria-label="Experience"><div class="hero"><h2 data-fx>My Professional Journey</h2><p class="ttl" data-fx>Select a position to read the details</p><ul class="jobs" id="jobs">${M.jobs.map((j,k)=>`<li><button class="tj" data-j="${k}"><em>${e(per(j))}</em><b>${e(j.nama_singkat||j.perusahaan)}</b><span class="pos">${e(j.jabatan)}</span></button></li>`).join('')}</ul></div>
 <div class="pw"><div class="panel" tabindex="0" aria-live="polite"><div class="dt" id="jd"></div></div></div></section>`,
`<section class="scene s3" aria-label="Portfolio"><div class="hero"><h2 data-fx>Portfolio</h2><p class="ttl" data-fx>Selected work & projects</p><div class="stats"><div><b>${M.port.length}</b><small>Projects</small></div></div><button class="cta" onclick="go(4)">Contact & archive ${I('arrow')}</button></div>
 <div class="pw"><div class="panel" tabindex="0" aria-label="Portfolio list">${M.port.map(pj).join('')||'<p class="empty">No projects yet.</p>'}</div></div></section>`,
`<section class="scene s4" aria-label="Contact and archive"><div class="hero"><h2 data-fx>Contact & Archive</h2><p class="ttl" data-fx>Get in touch · Documents</p><ul class="cl">${M.con.map(crow).join('')||'<li><div><span class="empty">Add contacts in the Kontak tab.</span></div></li>'}</ul></div>
 <div class="pw"><div class="panel" tabindex="0" aria-label="Archive">${M.arc.map(arc).join('')||'<p class="empty">No documents yet.</p>'}</div></div></section>`]}
function job(k){const el=$('#jd'),j=M.jobs[k];if(!j){el.innerHTML='<p class="empty">No experience yet.</p>';return}
 $$('.tj').forEach(b=>{const on=+b.dataset.j===k;b.classList.toggle('on',on);b.setAttribute('aria-current',on)});
 const meta=[['Sector',j.sektor],['Brand / product',j.merek_produk],['Location',j.lokasi],['Notes',j.catatan]].filter(m=>m[1]);
 el.innerHTML=`<div class="fl"><p class="lbl">${e(per(j))}</p><h2 data-fx>${e(j.perusahaan)}</h2><p class="rl">${e(j.jabatan)}</p><div class="meta">${meta.map(m=>`<span>${m[0]}: <b>${e(m[1])}</b></span>`).join('')}</div><div class="gr">${j.g.map(([g,it])=>`<div>${g?`<h4>${e(g)}</h4>`:''}${ul(it.map(x=>e(x.tugas)))}</div>`).join('')}</div></div>`;
 $('.s2 .panel').scrollTop=0;fx(el)}
/* glitch text */
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches,CH='ABCDEF0123456789<>/\\_+#%&';
function scr(el){if(RM)return;const t=el.dataset.t||(el.dataset.t=el.textContent);clearInterval(el._i);let f=0;el.classList.add('gl');el._i=setInterval(()=>{f++;const k=Math.floor(t.length*f/22);el.textContent=[...t].map((c,i)=>i<k||c===' '?c:CH[Math.random()*CH.length|0]).join('');if(f>=22){clearInterval(el._i);el.textContent=t;el.classList.remove('gl')}},42)}
function fx(r){$$('[data-fx]',r).forEach((x,i)=>setTimeout(()=>scr(x),250+i*120))}
/* ===== ENGINE ===== */
const names=['Profile','Background','Experience','Portfolio','Contact'],ic=['user','cap','case','grid','folder'],keys=['profile','background','experience','portfolio','contact'],N=5;let cur=-1,M;
function go(i){i=(i+N)%N;if(i===cur)return;cur=i;
 $$('.scene').forEach((s,k)=>{s.classList.toggle('on',k===i);if(k===i){s.scrollTop=0;$$('.panel,.hero',s).forEach(p=>p.scrollTop=0);fx(s)}});
 $$('.bg').forEach((b,k)=>b.classList.toggle('on',k===i));
 $$('#nav button').forEach((b,k)=>{b.classList.toggle('on',k===i);b.setAttribute('aria-current',k===i)});
 history.replaceState(null,'','#'+keys[i]);document.title=names[i]+' — '+(M.p.name||'')}
function clear(on){document.body.classList.toggle('clear',on);const b=$('#bgt');b.setAttribute('aria-pressed',on);b.innerHTML=on?I('eyeoff',18)+'Show content':I('eye',18)+'View background'}
function init(m){M=m;const st=M.st,p=M.p;
 $('.brand span').textContent=p.name||'';$('#main').innerHTML=scenes(M).join('');
 $('#nav').innerHTML=names.map((n,i)=>`<button data-i="${i}">${I(ic[i],18)}<span>${n}</span></button>`).join('');
 $('#mailb').innerHTML=I('mail',18);$('#prev').innerHTML=I('back');$('#next').innerHTML=I('arrow');$('#dx').innerHTML=I('x',18);
 const dim=parseFloat(st.dim);if(dim>=0)document.documentElement.style.setProperty('--dim',dim);
 document.body.classList.toggle('nozoom',(st.zoom||'').toLowerCase()==='false');
 $('#bgs').innerHTML=Array.from({length:N},()=>'<div class="bg"></div>').join('');
 const cands=n=>['jpg','jpeg','png','webp'].map(x=>`images/menu${n}.${x}`).concat(st['bg'+n+'_drive']?[`https://lh3.googleusercontent.com/d/${st['bg'+n+'_drive']}=w2400`]:[]);
 $$('.bg').forEach((el,i)=>{const n=i+1,c=n>3?cands(n).concat(cands(n-3)):cands(n);el.style.backgroundSize=st.fit||'cover';el.style.backgroundPosition=st['bg'+n+'_pos']||'center';
  (function t(k){if(k>=c.length)return;const im=new Image();im.onload=()=>el.style.backgroundImage=`url("${c[k]}")`;im.onerror=()=>t(k+1);im.src=c[k]})(0)});
 $('#bgt').onclick=()=>clear(!document.body.classList.contains('clear'));clear(false);
 const dlg=$('#dlg');$('#mailb').onclick=()=>{$('#cl').innerHTML=M.con.map(crow).join('')||'<li><div><span class="empty">No contact yet.</span></div></li>';dlg.showModal?dlg.showModal():dlg.setAttribute('open','')};
 $('#dx').onclick=()=>dlg.close();dlg.onclick=ev=>{if(ev.target===dlg)dlg.close()};
 document.addEventListener('click',ev=>{const b=ev.target.closest('[data-copy]');if(b){const t=b.dataset.copy;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{}).finally(()=>{const o=b.innerHTML;b.textContent='Copied';setTimeout(()=>b.innerHTML=o,1400)})}});
 $('#nav').onclick=ev=>{const b=ev.target.closest('button');if(b)go(+b.dataset.i)};
 $('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
 $('#jobs').onclick=ev=>{const b=ev.target.closest('.tj');if(b)job(+b.dataset.j)};
 document.addEventListener('keydown',ev=>{if(dlg.open)return;if(ev.key==='ArrowRight')go(cur+1);if(ev.key==='ArrowLeft')go(cur-1)});
 let tx=0,ty=0;addEventListener('touchstart',ev=>{tx=ev.touches[0].clientX;ty=ev.touches[0].clientY},{passive:true});
 addEventListener('touchend',ev=>{const dx=ev.changedTouches[0].clientX-tx,dy=ev.changedTouches[0].clientY-ty;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*2&&!ev.target.closest('.jobs,dialog'))go(cur+(dx<0?1:-1))},{passive:true});
 if(matchMedia('(hover:hover)').matches&&!RM)addEventListener('mousemove',ev=>{const b=$('#bgs').style;b.setProperty('--px',(ev.clientX/innerWidth-.5)*-18+'px');b.setProperty('--py',(ev.clientY/innerHeight-.5)*-12+'px')});
 job(0);go(Math.max(0,keys.indexOf(location.hash.slice(1))));setTimeout(()=>$('#ld').classList.add('off'),150)}
load().then(R=>init(build(R)));
</script>
